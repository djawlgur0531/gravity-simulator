<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>이체 · 삼체 문제 시뮬레이터</title>

<style>

/* =====================================
   기본 설정
===================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#space {
    display: block;
}


/* =====================================
   설정 패널
===================================== */

#controls {

    position: fixed;

    top: 20px;
    right: 20px;

    width: 240px;

    padding: 18px;

    background:
        rgba(30, 30, 30, 0.92);

    border:
        1px solid white;

    border-radius:
        12px;

}

#controls.closed {
    display: none;
}


#controls h2 {

    margin:
        0 0 16px 0;

    font-size:
        20px;

}


/* =====================================
   컨트롤
===================================== */

.control {

    margin-bottom:
        15px;

}

label {

    display: block;

    margin-bottom:
        7px;

    font-size:
        14px;

}

input[type="range"] {
    width: 100%;
}

input[type="color"] {

    width: 100%;
    height: 35px;

    cursor: pointer;

}


/* =====================================
   버튼
===================================== */

button {

    width: 100%;

    padding: 10px;

    margin-top: 5px;

    border: none;

    border-radius: 6px;

    cursor: pointer;

    font-size: 15px;

}


/* =====================================
   이체 / 삼체 버튼
===================================== */

.modeButtons {

    display: flex;

    gap: 8px;

    margin-bottom:
        18px;

}

.modeButton {

    flex: 1;

    margin: 0;

}

.activeMode {

    outline:
        2px solid white;

}


/* =====================================
   숨기기
===================================== */

.hidden {
    display: none;
}


/* =====================================
   설정 열기/닫기 버튼
===================================== */

#toggleControls {

    position: fixed;

    top: 20px;

    left: 50%;

    transform:
        translateX(-50%);

    width: auto;

    padding:
        10px 20px;

    margin: 0;

    z-index: 1000;

}


/* =====================================
   모바일
===================================== */

@media (max-width: 600px) {

    #controls {

        top: auto;

        bottom: 10px;

        left: 10px;
        right: 10px;

        width: auto;

        max-height: 45vh;

        overflow-y: auto;

        padding: 12px;

    }

}

</style>

</head>


<body>


<!-- =========================
     캔버스
========================= -->

<canvas id="space"></canvas>



<!-- =========================
     설정창
========================= -->

<div id="controls">

    <h2>
        중력 시뮬레이터
    </h2>


    <!-- 이체 / 삼체 -->

    <div class="modeButtons">

        <button
            id="twoBodyButton"
            class="modeButton activeMode"
        >
            이체
        </button>


        <button
            id="threeBodyButton"
            class="modeButton"
        >
            삼체
        </button>

    </div>



    <!-- 천체 A -->

    <div class="control">

        <label>
            천체 A 색상
        </label>

        <input
            type="color"
            id="colorA"
            value="#00aaff"
        >

    </div>



    <!-- 천체 B -->

    <div class="control">

        <label>
            천체 B 색상
        </label>

        <input
            type="color"
            id="colorB"
            value="#ffcc00"
        >

    </div>



    <!-- 천체 C -->

    <div
        class="control hidden"
        id="colorCControl"
    >

        <label>
            천체 C 색상
        </label>

        <input
            type="color"
            id="colorC"
            value="#ff4444"
        >

    </div>



    <!-- 중력 -->

    <div class="control">

        <label>

            중력 G:

            <span id="gravityValue">
                1
            </span>

        </label>


        <input
            type="range"
            id="gravity"
            min="0"
            max="3"
            step="0.1"
            value="1"
        >

    </div>



    <!-- 초기화 -->

    <button id="resetButton">

        초기화

    </button>

</div>



<!-- =========================
     설정창 토글 버튼
========================= -->

<button id="toggleControls">

    ⚙️ 설정 ▲

</button>



<script>


/* =====================================
   Canvas
===================================== */

const canvas =
    document.getElementById("space");

const ctx =
    canvas.getContext("2d");


function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}


resizeCanvas();


window.addEventListener(

    "resize",

    resizeCanvas

);



/* =====================================
   HTML 요소
===================================== */

const colorAInput =
    document.getElementById("colorA");

const colorBInput =
    document.getElementById("colorB");

const colorCInput =
    document.getElementById("colorC");


const colorCControl =
    document.getElementById(
        "colorCControl"
    );


const gravitySlider =
    document.getElementById(
        "gravity"
    );

const gravityValue =
    document.getElementById(
        "gravityValue"
    );


const resetButton =
    document.getElementById(
        "resetButton"
    );


const twoBodyButton =
    document.getElementById(
        "twoBodyButton"
    );

const threeBodyButton =
    document.getElementById(
        "threeBodyButton"
    );


const controls =
    document.getElementById(
        "controls"
    );


const toggleControls =
    document.getElementById(
        "toggleControls"
    );



/* =====================================
   시뮬레이션 변수
===================================== */

let G = 1;

let bodies = [];

let mode = 2;



/* =====================================
   카메라
===================================== */

let cameraX = 0;
let cameraY = 0;

let zoom = 1;


/*
   시작할 때
   약간 위에서 내려다보는 느낌
*/

let rotationX = 0.6;

let rotationY = 0;


/*
   드래그
*/

let isDragging = false;

let lastMouseX = 0;
let lastMouseY = 0;



/* =====================================
   이체 생성
===================================== */

function createTwoBodies() {

    const bodyA = {

        x: -200,
        y: 0,
        z: -100,

        vx: 0,
        vy: -1.12,
        vz: 0.25,

        mass: 1000,

        size: 18,

        color:
            colorAInput.value,

        trail: []

    };


    const bodyB = {

        x: 200,
        y: 0,
        z: 100,

        vx: 0,
        vy: 1.12,
        vz: -0.25,

        mass: 1000,

        size: 18,

        color:
            colorBInput.value,

        trail: []

    };


    bodies = [

        bodyA,
        bodyB

    ];

}



/* =====================================
   삼체 생성
===================================== */

function createThreeBodies() {

    const bodyA = {

        x: 0,
        y: -200,
        z: -120,

        vx: 1.2,
        vy: 0,
        vz: 0.2,

        mass: 1000,

        size: 18,

        color:
            colorAInput.value,

        trail: []

    };


    const bodyB = {

        x: -250,
        y: 200,
        z: 100,

        vx: -0.6,
        vy: 1,
        vz: -0.15,

        mass: 1000,

        size: 18,

        color:
            colorBInput.value,

        trail: []

    };


    const bodyC = {

        x: 250,
        y: 200,
        z: 20,

        vx: -0.6,
        vy: -1,
        vz: -0.05,

        mass: 1000,

        size: 18,

        color:
            colorCInput.value,

        trail: []

    };


    bodies = [

        bodyA,
        bodyB,
        bodyC

    ];

}



/* =====================================
   초기화
===================================== */

function resetSimulation() {

    G = 1;


    gravitySlider.value =
        1;


    gravityValue.textContent =
        1;


    if (mode === 2) {

        createTwoBodies();

    }

    else {

        createThreeBodies();

    }


    cameraX = 0;

    cameraY = 0;

    zoom = 1;


    /*
       카메라도 초기 각도로 복귀
    */

    rotationX = 0.6;

    rotationY = 0;

}



/* =====================================
   중력 계산
===================================== */

function applyGravity(A, B) {

    let dx =
        B.x - A.x;

    let dy =
        B.y - A.y;

    let dz =
        B.z - A.z;


    let distance =

        Math.sqrt(

            dx * dx +

            dy * dy +

            dz * dz

        );


    /*
       너무 가까워졌을 때
       계산 폭발 방지
    */

    if (distance < 30) {

        distance = 30;

    }


    const force =

        G *

        A.mass *

        B.mass /

        (distance * distance);


    const fx =

        force *

        dx /

        distance;


    const fy =

        force *

        dy /

        distance;


    const fz =

        force *

        dz /

        distance;



    /*
       A에 작용
    */

    A.vx +=
        fx / A.mass;

    A.vy +=
        fy / A.mass;

    A.vz +=
        fz / A.mass;



    /*
       B에 반대 방향 작용
    */

    B.vx -=
        fx / B.mass;

    B.vy -=
        fy / B.mass;

    B.vz -=
        fz / B.mass;

}



/* =====================================
   모든 천체 중력 계산
===================================== */

function calculateGravity() {

    for (

        let i = 0;

        i < bodies.length;

        i++

    ) {

        for (

            let j = i + 1;

            j < bodies.length;

            j++

        ) {

            applyGravity(

                bodies[i],

                bodies[j]

            );

        }

    }

}



/* =====================================
   위치 업데이트
===================================== */

function update() {

    calculateGravity();


    for (

        const body of bodies

    ) {

        body.x +=
            body.vx;

        body.y +=
            body.vy;

        body.z +=
            body.vz;

    }

}



/* =====================================
   궤적 저장
===================================== */

function saveTrails() {

    for (

        const body of bodies

    ) {

        body.trail.push({

            x: body.x,

            y: body.y,

            z: body.z

        });


        if (

            body.trail.length > 1000

        ) {

            body.trail.shift();

        }

    }

}



/* =====================================
   자동 카메라
===================================== */

function updateCamera() {

    let averageX = 0;

    let averageY = 0;


    for (

        const body of bodies

    ) {

        averageX +=
            body.x;

        averageY +=
            body.y;

    }


    averageX /=
        bodies.length;

    averageY /=
        bodies.length;



    /*
       천체 중심을 따라감
    */

    cameraX +=

        (averageX - cameraX)

        * 0.05;


    cameraY +=

        (averageY - cameraY)

        * 0.05;



    /*
       가장 멀리 있는 천체 찾기
    */

    let maxDistance = 1;


    for (

        const body of bodies

    ) {

        const dx =

            body.x -

            cameraX;


        const dy =

            body.y -

            cameraY;


        const distance =

            Math.sqrt(

                dx * dx +

                dy * dy

            );


        if (

            distance > maxDistance

        ) {

            maxDistance =
                distance;

        }

    }



    /*
       자동 줌
    */

    let targetZoom =

        Math.min(

            canvas.width,

            canvas.height

        )

        /

        (maxDistance * 3);



    targetZoom =

        Math.max(

            0.1,

            Math.min(

                targetZoom,

                2

            )

        );



    zoom +=

        (targetZoom - zoom)

        * 0.05;

}



/* =====================================
   3D 좌표 → 화면 좌표
===================================== */

function worldToScreen(
    x,
    y,
    z
) {


    /*
       Y축 회전
    */

    const cosY =
        Math.cos(rotationY);

    const sinY =
        Math.sin(rotationY);


    const rotatedX =

        x * cosY -

        z * sinY;


    const rotatedZ =

        x * sinY +

        z * cosY;



    /*
       X축 회전
    */

    const cosX =
        Math.cos(rotationX);

    const sinX =
        Math.sin(rotationX);


    const rotatedY =

        y * cosX -

        rotatedZ * sinX;


    const finalZ =

        y * sinX +

        rotatedZ * cosX;



    /*
       원근감
    */

    const perspectiveDistance =
        800;


    const perspective =

        perspectiveDistance /

        (

            perspectiveDistance +

            finalZ

        );



    /*
       너무 이상한 값 방지
    */

    const safePerspective =

        Math.max(

            0.2,

            Math.min(

                perspective,

                3

            )

        );



    /*
       화면 좌표 반환
    */

    return {

        x:

            (rotatedX - cameraX)

            *

            zoom

            *

            safePerspective

            +

            canvas.width / 2,


        y:

            (rotatedY - cameraY)

            *

            zoom

            *

            safePerspective

            +

            canvas.height / 2,


        scale:

            zoom

            *

            safePerspective

    };

}



/* =====================================
   바닥 격자
===================================== */

function drawGrid() {


    /*
       격자 크기
    */

    const gridSize =
        1000;


    /*
       선 간격
    */

    const spacing =
        100;



    /*
       격자는 항상
       먼저 그리기 때문에
       궤적과 천체 뒤에 있음
    */

    ctx.lineWidth =
        1;


    ctx.strokeStyle =
        "rgba(255,255,255,0.22)";



    /*
       X 방향 선
    */

    for (

        let z = -gridSize;

        z <= gridSize;

        z += spacing

    ) {

        const start =

            worldToScreen(

                -gridSize,

                0,

                z

            );


        const end =

            worldToScreen(

                gridSize,

                0,

                z

            );


        ctx.beginPath();


        ctx.moveTo(

            start.x,

            start.y

        );


        ctx.lineTo(

            end.x,

            end.y

        );


        ctx.stroke();

    }



    /*
       Z 방향 선
    */

    for (

        let x = -gridSize;

        x <= gridSize;

        x += spacing

    ) {

        const start =

            worldToScreen(

                x,

                0,

                -gridSize

            );


        const end =

            worldToScreen(

                x,

                0,

                gridSize

            );


        ctx.beginPath();


        ctx.moveTo(

            start.x,

            start.y

        );


        ctx.lineTo(

            end.x,

            end.y

        );


        ctx.stroke();

    }

}



/* =====================================
   궤적 그리기
===================================== */

function drawTrail(body) {

    if (

        body.trail.length < 2

    ) {

        return;

    }


    const length =
        body.trail.length;



    for (

        let i = 1;

        i < length;

        i++

    ) {


        const previous =

            worldToScreen(

                body.trail[i - 1].x,

                body.trail[i - 1].y,

                body.trail[i - 1].z

            );


        const current =

            worldToScreen(

                body.trail[i].x,

                body.trail[i].y,

                body.trail[i].z

            );



        /*
           최근 궤적일수록 밝게
        */

        const progress =
            i / length;


        const alpha =

            Math.pow(

                progress,

                4

            );



        ctx.beginPath();


        ctx.moveTo(

            previous.x,

            previous.y

        );


        ctx.lineTo(

            current.x,

            current.y

        );


        ctx.strokeStyle =
            body.color;


        ctx.globalAlpha =
            alpha;


        ctx.lineWidth =

            1 +

            alpha * 3;


        ctx.stroke();

    }


    ctx.globalAlpha = 1;

}



/* =====================================
   천체 그리기

   효과 없음
   그라데이션 없음
   그냥 동그라미
===================================== */

function drawBody(body) {

    const position =

        worldToScreen(

            body.x,

            body.y,

            body.z

        );


    const radius =

        Math.max(

            4,

            body.size *

            position.scale

        );



    ctx.beginPath();


    ctx.arc(

        position.x,

        position.y,

        radius,

        0,

        Math.PI * 2

    );


    ctx.fillStyle =
        body.color;


    ctx.fill();

}



/* =====================================
   3D 방향 축
===================================== */

function drawAxes() {


    const centerX =
        90;


    const centerY =
        canvas.height - 90;


    const axisLength =
        70;



    /*
       회전만 적용
       카메라 이동은 적용 안 함
    */

    function rotatePoint(
        x,
        y,
        z
    ) {


        const cosY =
            Math.cos(rotationY);

        const sinY =
            Math.sin(rotationY);


        const rotatedX =

            x * cosY -

            z * sinY;


        const rotatedZ =

            x * sinY +

            z * cosY;



        const cosX =
            Math.cos(rotationX);

        const sinX =
            Math.sin(rotationX);


        const rotatedY =

            y * cosX -

            rotatedZ * sinX;


        return {

            x:
                rotatedX,

            y:
                rotatedY

        };

    }



    function drawAxis(
        x,
        y,
        color,
        label
    ) {


        ctx.beginPath();


        ctx.moveTo(

            centerX,

            centerY

        );


        ctx.lineTo(

            centerX + x,

            centerY - y

        );


        ctx.strokeStyle =
            color;


        ctx.lineWidth =
            3;


        ctx.stroke();



        ctx.fillStyle =
            color;


        ctx.font =
            "bold 16px Arial";


        ctx.fillText(

            label,

            centerX + x * 1.15,

            centerY - y * 1.15

        );

    }



    const xAxis =

        rotatePoint(

            axisLength,

            0,

            0

        );


    const yAxis =

        rotatePoint(

            0,

            axisLength,

            0

        );


    const zAxis =

        rotatePoint(

            0,

            0,

            axisLength

        );



    drawAxis(

        xAxis.x,

        xAxis.y,

        "#ff4444",

        "X"

    );


    drawAxis(

        yAxis.x,

        yAxis.y,

        "#44ff44",

        "Y"

    );


    drawAxis(

        zAxis.x,

        zAxis.y,

        "#4488ff",

        "Z"

    );



    /*
       중심점
    */

    ctx.beginPath();


    ctx.arc(

        centerX,

        centerY,

        4,

        0,

        Math.PI * 2

    );


    ctx.fillStyle =
        "white";


    ctx.fill();

}



/* =====================================
   애니메이션
===================================== */

function animate() {


    /*
       화면 지우기
    */

    ctx.fillStyle =
        "black";


    ctx.fillRect(

        0,

        0,

        canvas.width,

        canvas.height

    );



    /*
       운동 계산
    */

    update();



    /*
       궤적 저장
    */

    saveTrails();



    /*
       카메라 업데이트
    */

    updateCamera();



    /*
       ① 바닥 격자

       가장 먼저 그려서
       모든 것의 뒤에 위치
    */

    drawGrid();



    /*
       색상 실시간 반영
    */

    if (

        bodies.length >= 2

    ) {

        bodies[0].color =
            colorAInput.value;

        bodies[1].color =
            colorBInput.value;

    }


    if (

        bodies.length === 3

    ) {

        bodies[2].color =
            colorCInput.value;

    }



    /*
       ② 궤적
    */

    for (

        const body of bodies

    ) {

        drawTrail(body);

    }



    /*
       ③ 천체
    */

    for (

        const body of bodies

    ) {

        drawBody(body);

    }



    /*
       ④ 방향 축

       화면 위에 표시
    */

    drawAxes();



    requestAnimationFrame(
        animate
    );

}



/* =====================================
   중력 슬라이더
===================================== */

gravitySlider.addEventListener(

    "input",

    function() {


        G =

            Number(

                gravitySlider.value

            );


        gravityValue.textContent =
            G;

    }

);



/* =====================================
   이체 버튼
===================================== */

twoBodyButton.addEventListener(

    "click",

    function() {


        mode = 2;


        twoBodyButton.classList.add(
            "activeMode"
        );


        threeBodyButton.classList.remove(
            "activeMode"
        );


        colorCControl.classList.add(
            "hidden"
        );


        resetSimulation();

    }

);



/* =====================================
   삼체 버튼
===================================== */

threeBodyButton.addEventListener(

    "click",

    function() {


        mode = 3;


        threeBodyButton.classList.add(
            "activeMode"
        );


        twoBodyButton.classList.remove(
            "activeMode"
        );


        colorCControl.classList.remove(
            "hidden"
        );


        resetSimulation();

    }

);



/* =====================================
   초기화 버튼
===================================== */

resetButton.addEventListener(

    "click",

    function() {

        resetSimulation();

    }

);



/* =====================================
   설정창 열기 / 닫기
===================================== */

toggleControls.addEventListener(

    "click",

    function() {


        controls.classList.toggle(
            "closed"
        );



        if (

            controls.classList.contains(
                "closed"
            )

        ) {

            toggleControls.textContent =
                "⚙️ 설정 ▼";

        }

        else {

            toggleControls.textContent =
                "⚙️ 설정 ▲";

        }

    }

);



/* =====================================
   3D 카메라 드래그
===================================== */

canvas.style.touchAction =
    "none";



canvas.addEventListener(

    "pointerdown",

    function(event) {


        isDragging =
            true;


        lastMouseX =
            event.clientX;


        lastMouseY =
            event.clientY;


        canvas.setPointerCapture(
            event.pointerId
        );

    }

);



canvas.addEventListener(

    "pointermove",

    function(event) {


        if (

            !isDragging

        ) {

            return;

        }



        const deltaX =

            event.clientX -

            lastMouseX;


        const deltaY =

            event.clientY -

            lastMouseY;



        rotationY +=

            deltaX * 0.003;


        rotationX +=

            deltaY * 0.003;



        /*
           카메라가 완전히 뒤집히는 것 방지
        */

        rotationX =

            Math.max(

                -Math.PI / 2,

                Math.min(

                    Math.PI / 2,

                    rotationX

                )

            );



        lastMouseX =
            event.clientX;


        lastMouseY =
            event.clientY;

    }

);



canvas.addEventListener(

    "pointerup",

    function(event) {


        isDragging =
            false;


        canvas.releasePointerCapture(
            event.pointerId
        );

    }

);



canvas.addEventListener(

    "pointercancel",

    function() {

        isDragging =
            false;

    }

);



/* =====================================
   시작
===================================== */

resetSimulation();

animate();


</script>
